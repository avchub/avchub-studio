name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; no job here needs more, and nothing reads a repository secret.
permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A job with no timeout inherits GitHub's 6-hour default, which is not a limit anyone waits for. These
    # jobs finish in a few minutes; the bounds below are generous enough never to cut a healthy run short
    # and small enough that a hang is reported while someone is still looking at the run.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Deliberately not a full cross product. Both supported Node versions are covered, and both platforms
      # are covered — Windows matters because the credential store is DPAPI and path handling differs — but
      # three jobs is enough signal for a first release. Widen it when there is a reason to.
      matrix:
        include:
          - { name: "ubuntu / node 20", os: ubuntu-latest, node: "20" }
          - { name: "ubuntu / node 22", os: ubuntu-latest, node: "22" }
          - { name: "windows / node 22", os: windows-latest, node: "22" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # Keyed on package-lock.json, which is committed.
          cache: npm

      # Installs exactly the committed lockfile, and fails if package.json and the lockfile disagree.
      - run: npm ci

      # FFmpeg is not a dependency of this project — the operator installs it. Installing it explicitly on
      # Linux means the media suites genuinely RUN on at least one platform instead of always skipping.
      #
      # This step once sat for 29 minutes on a single apt read while the identical step passed on the sibling
      # job in the same run, and would have kept sitting until the 6-hour job limit. apt has no default
      # network timeout, so the failure mode is a HANG, not an error — and a hang is the one thing a retry
      # loop cannot see. Each apt call therefore runs under `timeout`, which converts the hang into exit 124
      # that the loop CAN act on.
      #
      # If all three attempts fail the step FAILS the job. Continuing without FFmpeg would let the media
      # suites skip and the job report green with less coverage than it claims — worse than a red run,
      # because nobody would look. `ffmpeg -version` is checked afterwards for the same reason: a partial
      # install must not read as success.
      - name: Install FFmpeg (Linux only)
        if: runner.os == 'Linux'
        # Outer backstop. The inner budget is 3 x (90s + 180s) plus 40s of backoff = ~13.9 min, so this
        # bound is never what stops a healthy run; it only catches something the inner timeouts cannot.
        timeout-minutes: 15
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "::group::FFmpeg install attempt ${attempt}/3"
            # Acquire::Retries lets apt recover from a single bad mirror on its own; the http timeouts stop
            # it waiting forever on one that accepts the connection and then goes quiet.
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            status=0
            if timeout 90 sudo apt-get update "${apt_opts[@]}" \
               && timeout 180 sudo apt-get install -y --no-install-recommends "${apt_opts[@]}" ffmpeg; then
              echo "::endgroup::"
              # Prove the binaries the suites need are actually CALLABLE, not merely unpacked. apt can
              # report success over a broken install, and this step exists to make the media suites run —
              # letting them skip while the job stays green is the failure this whole step guards against.
              # Command substitution rather than a pipe: `ffmpeg -version | head -1` returns head's status,
              # so a missing binary would pass, and under pipefail a SIGPIPE would fail a healthy one.
              if ffmpeg_version=$(ffmpeg -version 2>&1) && ffprobe_version=$(ffprobe -version 2>&1); then
                echo "${ffmpeg_version%%$'\n'*}"
                echo "${ffprobe_version%%$'\n'*}"
                exit 0
              fi
              echo "::error title=FFmpeg install::apt reported success but ffmpeg/ffprobe are not usable"
              exit 1
            else
              # $? must be read INSIDE the else branch. After an if/fi whose condition was false and which
              # has no else, POSIX defines $? as 0, so reading it there would report success for every
              # failure and hide the 124 that distinguishes a hang from an error.
              status=$?
            fi
            echo "::endgroup::"
            if [ "${status}" -eq 124 ]; then
              echo "::warning title=FFmpeg install::attempt ${attempt} timed out (apt hung, exit 124)"
            else
              echo "::warning title=FFmpeg install::attempt ${attempt} failed with exit ${status}"
            fi
            [ "${attempt}" -lt 3 ] && sleep $((attempt * 10))
          done
          echo "::error title=FFmpeg install::could not install FFmpeg after 3 attempts; failing rather than running the media suites as skips"
          exit 1

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test-protocol
      - run: npm run test-recovery

      # Exercises the media path on Linux, where FFmpeg was installed above. On Windows its media halves skip
      # with a named reason and the pure halves still run, so the job is meaningful on both.
      - run: npm run test-step5c10

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the scan sees every commit rather than only the tip.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # No npm ci: the scanner uses only Node built-ins, by design, so no dependency can influence it.
      - run: npm run scan:secrets

  database:
    name: database suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Pinned by digest so the job cannot silently change database under us: postgres:16 is a moving tag
        # that gets a new patch build regularly. This is the multi-arch index digest, so it resolves on any
        # runner architecture. Dependabot keeps it current from the tag in the comment.
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20 # postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # A throwaway service container that lives only for this job. The suites connect as cp_migrator, the
      # role that owns the schema; the database name must contain "_test" or the safety guard refuses to run
      # destructive tests against it at all.
      # scan-secrets:allow ephemeral CI service container, not a real database
      CONTROL_PLANE_TEST_DB_URL: postgres://cp_migrator:ci_migrator@127.0.0.1:5432/avchub_studio_test
      # scan-secrets:allow ephemeral CI service container, not a real database
      CONTROL_PLANE_DB_OPS_URL: postgres://cp_ops_enumerator:ci_ops@127.0.0.1:5432/avchub_studio_test
      CONTROL_PLANE_DB_ALLOW_DESTRUCTIVE_TESTS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Migration 0010 grants to cp_tenant_app, cp_ops_enumerator and cp_readonly_observer, so those roles
      # must exist BEFORE the first migration runs — a bare superuser database fails at 0010 with
      # "undefined_object". These are the project's own bootstrap templates, run in their documented order
      # (roles, then database), which is also what a self-hoster does once by hand.
      #
      # The passwords are literals for a container that is destroyed when this job ends. They are not secrets
      # and deliberately do not come from GitHub secrets: a public fork must be able to run this job.
      - name: Bootstrap roles and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -v migrator_password=ci_migrator -v tenant_password=ci_tenant -v ops_password=ci_ops -v observer_password=ci_observer -f control-plane/database/bootstrap/roles.sql.template
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -v db_name=avchub_studio_test -f control-plane/database/bootstrap/database.sql.template

      # The migration credential is deliberately NOT part of the running service's config — migrations are
      # command-only and config.mjs refuses to read this variable. Setting it job-wide would defeat that
      # separation, so it is scoped to this one step.
      - name: Apply migrations (command-only credential)
        env:
          # scan-secrets:allow ephemeral CI service container, not a real database
          CONTROL_PLANE_DB_MIGRATION_URL: postgres://cp_migrator:ci_migrator@127.0.0.1:5432/avchub_studio_test
        run: |
          npm run control-plane:db:migrate
          npm run control-plane:db:status

      # With a reachable database the suites RUN rather than skip; they fall back to the test URL for
      # migration and ops connections that are not set explicitly.
      - run: npm run control-plane:test
