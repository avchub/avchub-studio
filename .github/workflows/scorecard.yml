name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '31 4 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard reads the repository through the public GitHub API, so on a private repository it fails with
    # "repository not found" — a red run that says nothing about the code. Gated on visibility rather than
    # deleted: the moment this repository becomes public the condition is true and the job runs itself, with
    # no edit needed. While private the job is SKIPPED, which is neutral, not a failure.
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
