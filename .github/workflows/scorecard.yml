name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '31 4 * * 1'
  push:
    branches: [main]
  # Manual trigger, added because re-running a workflow does NOT re-evaluate the event context: a rerun
  # replays the ORIGINAL payload. When this repository went public the existing runs stayed SKIPPED however
  # many times they were re-run, because their stored payload still said the repository was private, and
  # changing visibility fires no push. workflow_dispatch produces a genuinely fresh event, which is the only
  # thing that can re-evaluate the condition below on demand.
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard reads the repository through the public GitHub API, so on a private repository it fails with
    # "repository not found" — a red run that says nothing about the code. The repository is public now and
    # this condition is true, so the guard is kept only for the case where it goes private again: a skipped
    # job is neutral, a failing one would be noise. See the workflow_dispatch note above for why a rerun
    # cannot be used to re-evaluate it.
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
